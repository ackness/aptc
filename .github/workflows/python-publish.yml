# Uploads the Python package to PyPI when a GitHub release is published.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]
  # also allows a manual run from the Actions tab (no release needed)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — no API token needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing needs a one-time setup on PyPI:
        #   project aptc → Publishing → "Add a new pending publisher"
        #   owner: ackness, repository: aptc, workflow: python-publish.yml
        # To use an API token instead, add:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
