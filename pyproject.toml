[project]
name = "aptc"
version = "0.1.0"
description = "A simple web3py like client for APTOS chain."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Yong", email = "ackness8@gmail.com" },
]
requires-python = ">=3.14"
keywords = ["apt", "aptos", "block chain", "web3"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx>=0.23.0",
    "PyNaCl>=1.5.0",
    "urllib3>=1.26.4",
]

[project.urls]
Homepage = "https://github.com/ackness/aptc"
Repository = "https://github.com/ackness/aptc"

[dependency-groups]
dev = [
    "loguru>=0.7.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit live Aptos endpoints (skipped by default)",
]
addopts = "-m 'not network'"
